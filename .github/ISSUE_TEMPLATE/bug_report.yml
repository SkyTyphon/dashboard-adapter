name: Bug report
description: Report an import, analysis, mapping, or export problem
body:
  - type: markdown
    attributes:
      value: Remove secrets, private URLs, IP addresses, and personal entity names before attaching a dashboard.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Dashboard format
      options: [YAML, JSON]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized example
    validations:
      required: true
